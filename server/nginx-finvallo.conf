# Finvallo – statische Website (wird von server/setup.sh installiert)
server {
    listen 80;
    listen [::]:80;
    server_name finvallo.com www.finvallo.com;

    root /var/www/finvallo/public;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/json application/xml image/svg+xml;

    # www -> ohne www (eine einzige kanonische Adresse)
    if ($host = www.finvallo.com) { return 301 $scheme://finvallo.com$request_uri; }

    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|png|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public, max-age=2592000"; }
    location ~ /\.(?!well-known) { deny all; }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css text/plain application/json application/javascript image/svg+xml application/xml;
}
