# Finvallo – statische Website (wird von server/setup.sh installiert)
server {
    listen 80;
    listen [::]:80;
    server_name finvallo.com www.finvallo.com;

    root /var/www/finvallo/public;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/json application/xml image/svg+xml;

    # www -> ohne www (eine einzige kanonische Adresse)
    if ($host = www.finvallo.com) { return 301 $scheme://finvallo.com$request_uri; }

    # 301-Weiterleitungen (automatisch erzeugt von tools/karten.py)
    include /var/www/finvallo/server/redirects.conf;

    # HTML/XML/TXT/JSON 10 Minuten (must-revalidate), CSS/JS (per ?v=Hash versioniert) 1 Jahr, Bilder/Schriften 1 Tag
    add_header Cache-Control "public, max-age=600, must-revalidate";
    # Sicherheits-Header (auch in jeder location mit eigenem add_header, sonst gehen sie dort verloren)
    include /var/www/finvallo/server/security-headers.conf;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=31536000, immutable"; include /var/www/finvallo/server/security-headers.conf; }
    location ~* \.(png|jpg|jpeg|webp|svg|ico|webmanifest)$ { add_header Cache-Control "public, max-age=86400"; include /var/www/finvallo/server/security-headers.conf; }
    location ~* \.woff2?$ { add_header Cache-Control "public, max-age=31536000, immutable"; include /var/www/finvallo/server/security-headers.conf; }
    location ~ /\.(?!well-known) { deny all; }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css text/plain application/json application/javascript image/svg+xml application/xml application/manifest+json;
    gzip_vary on;
}
